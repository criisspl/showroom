<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Armario · tu asesora de imagen con IA</title>
    <meta
      name="description"
      content="Análisis de color, cuerpo y estilo con IA, armario virtual y outfits con tu propia ropa. Gratis y sin registrarte."
    />
    <meta name="theme-color" content="#E3E4CF" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Armario" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <p class="a-status" id="a-status" role="status" hidden></p>

    <!-- ============ Bienvenida / análisis inicial ============ -->
    <section class="panel" id="tab-bienvenida" data-panel="bienvenida" hidden>
      <div class="wrap"></div>
    </section>

    <!-- ============ Hoy ============ -->
    <section class="panel" id="tab-hoy" data-panel="hoy" hidden>
      <div class="wrap"></div>
    </section>

    <!-- ============ Armario ============ -->
    <section class="panel" id="tab-armario" data-panel="armario" hidden>
      <div class="wrap"></div>
    </section>

    <!-- ============ Deseos ============ -->
    <section class="panel" id="tab-deseos" data-panel="deseos" hidden>
      <div class="wrap"></div>
    </section>

    <!-- ============ Historial ============ -->
    <section class="panel" id="tab-historial" data-panel="historial" hidden>
      <div class="wrap"></div>
    </section>

    <!-- ============ Mi análisis ============ -->
    <section class="panel" id="tab-analisis" data-panel="analisis" hidden>
      <div class="wrap" id="an-wrap"></div>
      <div class="wrap" id="a-gusto"></div>
    </section>

    <!-- ============ Ajustes ============ -->
    <section class="panel" id="tab-ajustes" data-panel="ajustes" hidden>
      <div class="wrap"></div>
    </section>

    <nav class="a-tabs" id="a-tabs" aria-label="Secciones" hidden>
      <div class="in">
        <button type="button" data-tab="hoy">Hoy</button
        ><button type="button" data-tab="armario">Armario</button
        ><button type="button" data-tab="deseos">Deseos</button
        ><button type="button" data-tab="historial">Historial</button
        ><button type="button" data-tab="analisis">Análisis</button>
      </div>
    </nav>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
