version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-y-patch:
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint aún no admite TypeScript 7
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-y-patch:
        update-types: ["minor", "patch"]
